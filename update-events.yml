name: Update Bookwhen events
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # manual run button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch events
        env:
          BOOKWHEN_API_KEY: ${{ secrets.BOOKWHEN_API_KEY }}
        run: python3 fetch_events.py
      - name: Commit if changed
        run: |
          git config user.name "bookwhen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Update events $(date -u +%F_%H:%M)"
          git push
