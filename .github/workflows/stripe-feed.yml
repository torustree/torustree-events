# .github/workflows/stripe-feed.yml
#
# Torus Tree - Stripe to Zoho booking feed.
#
# Offset 15 minutes from the update-events job so the two never contend for the
# events.json file.
#
# SAFETY: starts in dry-run. Flip DRY_RUN to "false" only after a clean Phase 1
# run has been reviewed. Logs on a public repo are world-readable - the script
# emits counts only, never customer data.

name: stripe-feed

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan writes without making them"
        type: boolean
        default: true
      lookback_days:
        description: "How many days of Stripe charges to scan"
        type: string
        default: "7"

permissions:
  contents: read

concurrency:
  group: stripe-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run feed
        env:
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          # Scheduled runs write. A manual dispatch can still ask for dry-run.
          #
          # The 'false' fallback is deliberately the same value the unticked
          # checkbox produces, which is what makes this safe either way:
          # github.event.inputs hands over the *string* "false" (non-empty, so
          # truthy, so || returns it), while the typed inputs context would give
          # a real boolean false (falsy, so || falls through to the literal).
          # Both land on "false", so unticking the box always means "write".
          # Do not flip this fallback to 'true' — then unticking would fall
          # through to a dry run and silently skip a write you asked for.
          # scripts/stripe_zoho_feed.py treats only the exact string "false" as
          # permission to write; anything else, including unset, dry-runs.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: python scripts/stripe_zoho_feed.py
